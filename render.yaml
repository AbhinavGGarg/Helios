# Render Blueprint — deploys the Helios backend as a Docker web service.
# The frontend deploys separately on Vercel and points at this service via
# BACKEND_API_URL (see README "Deploy"). A hosted backend has no local Ollama,
# so it uses an OpenAI-compatible provider; self-hosting still defaults to Ollama.
services:
  - type: web
    name: helios-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    # Bind to the port Render assigns ($PORT) instead of the fixed 8000.
    dockerCommand: sh -c "uv run fastapi run backend/main.py --host 0.0.0.0 --port ${PORT:-8000}"
    plan: starter            # security tools (semgrep, sqlmap) are memory-heavy; free (512MB) will OOM
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai        # OpenAI-compatible endpoint (no local Ollama in the cloud)
      - key: OPENAI_BASE_URL
        value: https://api.featherless.ai/v1
      - key: OPENAI_API_KEY
        sync: false          # set in the Render dashboard — never commit a key
      - key: OPENAI_MODEL
        sync: false          # e.g. a Featherless-hosted open model id
      - key: CORS_ALLOW_ORIGINS
        sync: false          # set to your Vercel frontend origin if calling the API directly
      - key: REPO_CLONE_ROOT
        value: /var/helios/repos
      - key: ENFORCE_TARGET_ALLOWLIST
        value: "true"        # hosted instance: only scan sanctioned demo targets
      - key: ALLOWED_TARGETS
        value: example.com,scanme.nmap.org,testphp.vulnweb.com
    disk:
      name: helios-repos
      mountPath: /var/helios/repos
      sizeGB: 1
